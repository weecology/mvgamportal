# Configuration for sliding_window_fits.R, read with config::get().
#
# Each `name` under models must have a matching branch in fit_model() in
# R/models.R. The name is also used to label and name the plots written to
# figures/.
#
# `trace_plot: yes` writes an MCMC trace plot for every model; set it to no
# to skip them.
#
# BASELINE is the reference model that skill scores are computed against, so
# it should stay in this list unless skill scores are not needed.
default:
  # Length of the training window, in newmoons.
  train_win_width: 60

  # Write an MCMC trace plot per model alongside the forecast plots.
  trace_plot: no

  # Which forecast windows to run, as newmoonnumbers passed to seq().
  # Omit this block entirely to run every window that fits in the data.
  test_starts:
    from: 156
    to: 500
    by: 1

  # Groups of species to fit models to. Omit `species` to use every species in
  # the data. `separately: yes` fits one model per species in the list instead
  # of a single model over all of them together, and each of those runs is
  # labelled with its species name rather than the group name.
  species_sets:
    - name: all

    - name: single
      species: [DM, DO, DS, PB, PP, PF]
      separately: yes

  # `species_sets` lists which of the groups above to fit each model to; omit
  # it to fit that model to every group. Note VAR() needs more than one
  # species, so GAM_VAR cannot be run on a single-species group.
  models:
    - name: BASELINE
      species_sets: [single]

    - name: AR_SINGLE_SPECIES
      species_sets: [single]

    - name: sAR_separate
      species_sets: [single]

    - name: tempAR_separate
      species_sets: [single]

#    - name: GAM_AR
#      species_sets: [all]

#    - name: GAM_VAR
#      species_sets: [all]

